spring.application.name=vietnam-vr-tourism

# ===============================
# Server Configuration
# ===============================
server.port=8091

# ===============================
# Datasource Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/vietnam_vr_tourism?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# B?n ?ã t?o b?ng th? công trong phpMyAdmin -> dùng validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# Logging
# ===============================
logging.level.com.vr.tourism=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# CORS (cho frontend dev)
# ===============================
cors.allowed-origins=http://localhost:4200,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Content-Disposition

# ===============================
# JWT (scaffold - s? dùng ? Phase sau)
# ===============================
jwt.secret=your_super_secret_key_at_least_32_chars_long
jwt.access-token-exp-minutes=60
jwt.refresh-token-exp-days=7
